# Kit for running Claude Code against this repository in a Docker Sandboxes
# microVM — the counterpart of .devcontainer/, kept alongside it for comparison.
#
# The sandbox has no cluster credentials and no SSH keys: the agent reads and
# edits code, and anything that touches the cluster is run by the operator.

# The loader forks the grammar on schemaVersion: without it the file is decoded
# as v1, whose struct has no `permissions` or `setup`, and loading fails.
schemaVersion: "2"
kind: mixin
name: homelab

# Open egress so the agent can research freely, matching .devcontainer/firewall.sh
# rather than the allowlist in anthropics/claude-code. The LAN is closed by two
# things this file does not express: sbx blocks private, loopback and link-local
# addresses by default and blocks non-HTTP protocols outright, and the CIDR denies
# `just sbx-up` passes at creation narrow it further. Those live there because
# CIDR is enforced by `sbx policy` but not by a kit (SPEC-v2 §5.2 lists it as
# declared and not applied), so writing the ranges here would read as protection
# while doing nothing. Deny always beats allow, including this wildcard.
permissions:
  network:
    allow:
      - "**"

environment:
  variables:
    # Outside the mounted repository, so the sandbox never writes Linux binaries
    # into the host's .venv. `just venv` and `uv run` both follow this.
    VIRTUAL_ENV: /opt/venv
    UV_VENV_CLEAR: "1"

setup:
  install:
    # libonig-dev, gcc, libc6-dev and python3-dev are here for `just venv`:
    # ansible-dev-tools pulls in onigurumacffi, which publishes no wheel for this
    # Python on arm64 and so compiles _onigurumacffi.c against oniguruma.h. The
    # agent image carries no C toolchain — the build fails on a missing
    # aarch64-linux-gnu-gcc before it ever looks for a header — and
    # --no-install-recommends means gcc does not drag in libc6-dev on its own.
    # git-crypt is required by the filters .gitattributes declares on the sshd
    # hardening templates — without the binary, git refuses to run those filters
    # and ordinary commands like `git status` fail. The sandbox has no decryption
    # key, so those two files stay encrypted — which is the intent.
    - command: >-
        apt-get update &&
        apt-get install -y --no-install-recommends
        git-crypt libonig-dev gcc libc6-dev python3-dev
    # just names its release tarballs by Rust target triple, so the Debian
    # architecture has to be translated — the sandbox is arm64 on Apple Silicon.
    - command: |
        set -eu
        case "$(dpkg --print-architecture)" in
            amd64) just_target=x86_64-unknown-linux-musl
                just_sha256=4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d ;;
            arm64) just_target=aarch64-unknown-linux-musl
                just_sha256=748237128c4c40cbdabc65e841d05ceba13cc23a91eaba395495894c1d9764df ;;
            *) echo "unsupported architecture: $(dpkg --print-architecture)" >&2; exit 1 ;;
        esac
        just_url="https://github.com/casey/just/releases/download/1.58.0"
        curl -fsSL -o /tmp/just.tar.gz "$just_url/just-1.58.0-$just_target.tar.gz"
        echo "$just_sha256  /tmp/just.tar.gz" | sha256sum -c -
        tar -xzf /tmp/just.tar.gz -C /usr/local/bin just
        rm /tmp/just.tar.gz
    - command: >-
        curl -LsSf https://astral.sh/uv/0.12.3/install.sh
        | env UV_UNMANAGED_INSTALL=/usr/local/bin sh
    # Ansible is deliberately not baked into a template — running the
    # repository's own recipe here exercises the documented setup path on every
    # rebuild instead of a parallel one that can drift. The recipe reads
    # VIRTUAL_ENV, so the environment lands outside the mount.
    #
    # WORKSPACE_DIR is the variable the runtime exports; ${WORKDIR} is a
    # placeholder the engine substitutes into setup.files content only, and is
    # unset in a command, so `${WORKDIR:-$PWD}` ran in / and found no justfile.
    # `:?` fails loudly rather than silently building in the wrong directory.
    # The venv is created as root but the agent runs as `agent`, so hand it over
    # or `uv run` cannot write to it.
    - command: |
        set -eu
        cd "${WORKSPACE_DIR:?workspace directory not set}"
        export UV_CACHE_DIR="$WORKSPACE_DIR/.sbx/uv-cache"
        just venv
        chown -R agent:agent "${VIRTUAL_ENV:?virtual environment path not set}" "$UV_CACHE_DIR"
    # /etc/claude-code is the highest settings precedence, so a checked-out branch
    # cannot edit it away. The source file is shared with the dev container so the
    # two cannot drift; where it sits in the repository it is inert, Claude Code
    # reading managed settings only from /etc/claude-code.
    #
    # Installed by a command rather than setup.files: file writes do not run as
    # root, so creating /etc/claude-code failed with "mkdir: Permission denied".
    # Install commands default to user 0.
    - command: |
        set -eu
        install -D -m 0644 \
            "${WORKSPACE_DIR:?workspace directory not set}/.claude/managed-settings.json" \
            /etc/claude-code/managed-settings.json
      user: "0"
  startup:
    # The repository is bind-mounted, so a directory inside it is storage on the
    # host and outlives the sandbox — the counterpart of the dev container's
    # named volumes. Written at startup rather than set in environment.variables
    # because the workspace path is only known at runtime, and read back from
    # /etc/sandbox-persistent.sh, which every login shell in the sandbox sources.
    - command:
        - sh
        - -c
        - >-
          mkdir -p "$WORKSPACE_DIR/.sbx/claude" &&
          chown agent:agent "$WORKSPACE_DIR/.sbx/claude" &&
          echo "export CLAUDE_CONFIG_DIR=$WORKSPACE_DIR/.sbx/claude"
          > /etc/sandbox-persistent.sh
      user: "0"
