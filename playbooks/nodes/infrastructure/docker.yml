---
# ==============================================================================
# Playbook: Install and Configure Docker
# ==============================================================================
# Installs and configures Docker Engine and Docker Compose, and manages the
# containerd runtime that both Docker and the cluster depend on.
#
# containerd arrives here as a Docker dependency (the containerd.io package),
# but it is not Docker's private component — it is the container runtime for
# the whole node. The kubelet connects to it directly, so every cluster
# container is run by the same daemon that runs Docker's, without passing
# through dockerd. cluster/kubernetes.yml is what enables its CRI plugin and
# points the kubelet at the socket; this playbook installs the daemon.
#
# The two are kept apart by containerd namespaces: Docker works in 'moby' and
# Kubernetes in 'k8s.io', and containerd's garbage collection only ever
# considers references within a single namespace. That is why one daemon can
# serve both without 'docker system prune' being able to reach cluster images.
#
# Nothing separate is installed for the cluster's benefit. Anything that needs
# to place an image where the kubelet can see it uses 'ctr -n k8s.io', which
# ships with containerd.io — deliberately, rather than adding a second
# toolchain alongside the one Docker already provides.
#
# This playbook performs the following actions:
#   - Installs prerequisite packages (ca-certificates, curl).
#   - Adds Docker's official GPG key and APT repository.
#   - Installs Docker Engine, CLI, containerd, and Docker Compose plugin.
#   - Adds docker_users to the 'docker' group to manage Docker as a
#     non-root user.
#   - Writes the Docker daemon configuration, enabling live restore so that
#     upgrading Docker does not stop running containers.
#   - Starts and enables the containerd and Docker services.
#
# Variables:
#   docker_prereq_packages:    List of APT packages required to add Docker's
#                              repository (default: [ca-certificates, curl]).
#   docker_packages:           List of Docker APT packages to install
#                              (default: [docker-ce, docker-ce-cli,
#                              containerd.io, docker-buildx-plugin,
#                              docker-compose-plugin]).
#   docker_users:              Accounts placed in the 'docker' group
#                              (default: [the inventory connection user]).
#   docker_daemon_config_path: Path to the Docker daemon configuration file
#                              (default: /etc/docker/daemon.json).
#   docker_live_restore:       Whether Docker's own containers keep running
#                              across a Docker daemon restart. Cluster
#                              containers are unaffected either way — they do
#                              not run through dockerd (default: true).

- name: Install and configure Docker
  hosts: nodes
  become: true
  become_exe: sudo.ws
  vars:
    docker_prereq_packages:
      - ca-certificates
      - curl
    docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    docker_users:
      - '{{ ansible_user }}'
    docker_daemon_config_path: /etc/docker/daemon.json
    docker_live_restore: true

  tasks:
    # -------------------------------------------------------------------------
    # Prerequisites
    # Installs packages needed to add the Docker APT repository securely, and
    # ensures the system keyring directory exists to store the GPG key.
    # -------------------------------------------------------------------------
    - name: Install prerequisite packages for Docker repository
      ansible.builtin.apt:
        name: '{{ docker_prereq_packages }}'
        state: present

    - name: Ensure /etc/apt/keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    # -------------------------------------------------------------------------
    # Repository Configuration
    # Adds Docker's official GPG key and APT repository so that packages can
    # be installed from Docker's distribution channel rather than the OS repos.
    # -------------------------------------------------------------------------
    - name: Download Docker's official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add the official Docker APT repository
      ansible.builtin.apt_repository:
        repo: >
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        filename: docker
        state: present
        update_cache: true

    # -------------------------------------------------------------------------
    # Installation and User Access
    # Installs Docker Engine and its plugins, and grants docker_users non-root
    # access via the 'docker' group.
    #
    # The accounts come from docker_users rather than from a gathered fact. The
    # earlier version used ansible_user_id, which is the user Ansible's modules
    # run as — and since this play sets become at play level, fact gathering
    # runs as root too, so the task added root to the group rather than the
    # inventory user. Nothing fails when that happens: an account outside the
    # 'docker' group falls back to sudo for each docker command instead of
    # erroring, so the play stays green and the membership is never questioned.
    # -------------------------------------------------------------------------
    - name: Install Docker Engine, CLI, and plugins
      ansible.builtin.apt:
        name: '{{ docker_packages }}'
        state: present
        update_cache: true

    - name: Add Docker users to the 'docker' group
      ansible.builtin.user:
        name: '{{ item }}'
        groups: docker
        append: true
      loop: '{{ docker_users }}'

    # -------------------------------------------------------------------------
    # Daemon Configuration
    # Enables live restore, which keeps Docker's own containers running while
    # dockerd itself restarts, so an 'apt upgrade' carrying a new Docker
    # version does not stop them. It does not affect anything the cluster runs
    # — the kubelet does not reach containerd through dockerd. See the template
    # for what it covers and what it defers.
    #
    # The packages are deliberately NOT held at their installed version. A hold
    # would trade an unscheduled outage for Docker silently dropping out of
    # security patching, which is the worse failure on a node running the
    # cluster's secrets. containerd needs neither treatment: its per-container
    # shim processes survive a daemon restart by design.
    #
    # daemon.json is managed in full, not merged: any setting added by hand on
    # a node is removed on the next run. Add it to the template instead.
    # -------------------------------------------------------------------------
    - name: Configure the Docker daemon
      ansible.builtin.template:
        src: docker-daemon.json.j2
        dest: '{{ docker_daemon_config_path }}'
        mode: '0644'
        owner: root
        group: root
      notify: Reload Docker

    # -------------------------------------------------------------------------
    # Services
    # containerd is started and enabled on its own footing rather than only as
    # a dependency of docker.service. The containerd.io package already enables
    # it, so this is normally a no-op — it is stated explicitly because the
    # cluster's runtime should not be running as a side effect of Docker's unit
    # when Docker is not what depends on it most.
    # -------------------------------------------------------------------------
    - name: Start and enable the containerd service
      ansible.builtin.systemd:
        name: containerd
        state: started
        enabled: true

    - name: Start and enable the Docker service
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

  handlers:
    # Reload rather than restart. live-restore is picked up by a daemon reload,
    # and restarting dockerd to enable it would stop the containers the setting
    # exists to keep running — it is not yet in effect during the restart that
    # turns it on.
    - name: Reload Docker
      ansible.builtin.systemd:
        name: docker
        state: reloaded
