---
# ==============================================================================
# Playbook: Install and Configure Kubernetes
# ==============================================================================
# Installs and configures Kubernetes components (kubelet, kubeadm, kubectl).
#
# This playbook performs the following actions:
#   - Installs prerequisite packages (ca-certificates, curl, gnupg, apt-transport-https).
#   - Adds the official Kubernetes GPG key and APT repository.
#   - Ensures time synchronization is active via chrony.
#   - Loads required kernel modules and sets sysctl networking parameters.
#   - Disables swap (runtime and permanently via /etc/fstab), a requirement for kubelet.
#   - Configures containerd's CRI plugin and removes cri-dockerd, so the
#     kubelet talks to containerd directly rather than through Docker.
#   - Installs kubelet, kubeadm, and kubectl.
#   - Configures the kubelet cgroup driver to match containerd (systemd) and
#     enables the seccomp default so every container without an explicit
#     seccompProfile runs under the container runtime's RuntimeDefault
#     profile instead of Unconfined. Existing containers keep their current
#     profile until recreated; Pod Security Admission restricted namespaces
#     are unaffected because their pods already declare RuntimeDefault.
#   - Places a hold on installed packages to prevent accidental upgrades.
#   - Starts and enables the kubelet service.
#   - Installs Helm via the official APT repository.
#   - Installs k9s, a terminal UI for managing Kubernetes clusters.
#   - Installs a systemd shutdown hook that cordons and drains the node before
#     any shutdown or reboot, allowing Longhorn volumes to detach cleanly.
#   - Installs a systemd service bound to sleep.target that locally stops
#     kubelet, containers, and iSCSI before suspend (S3 or S0ix) and restores
#     them on resume. No drain or cross-node coordination — Longhorn handles
#     reconciliation natively on wake.
#   - Writes a kubelet drop-in (after-containerd.conf) that declares a hard
#     dependency on containerd.service, ensuring kubelet never starts before its
#     CRI socket is available.
#   - Removes superseded pkgs.k8s.io channels so raising kube_version replaces
#     the APT repository entry rather than adding a second one.
#   - Corrects the kubeadm CRI socket annotation on every node where it no
#     longer matches containerd_cri_endpoint.
#
# Runs one node at a time (serial: 1) because it can restart containerd and the
# kubelet. See the comment above the play.
#
# Variables:
#   kube_version:        Kubernetes minor version channel of the pkgs.k8s.io
#                        APT repository (default: v1.35). Selects a channel
#                        rather than pinning a version — the packages are held
#                        after install, so this is what an upgrade would be
#                        allowed to reach, not what is running.
#   keyring_path:        Path to store the Kubernetes APT GPG keyring
#                        (default: /etc/apt/keyrings/kubernetes-apt-keyring.gpg).
#   kube_packages:       List of Kubernetes packages to install, all held at
#                        their installed version afterwards
#                        (default: [kubelet, kubeadm, kubectl, cri-tools]).
#   containerd_config_path: Path to the containerd configuration file
#                        (default: /etc/containerd/config.toml).
#   crictl_config_path:  Path to the crictl configuration file, which points
#                        the CRI client at the same socket as the kubelet
#                        (default: /etc/crictl.yaml).
#   containerd_cri_endpoint: CRI socket the kubelet connects to
#                        (default: unix:///run/containerd/containerd.sock).
#   containerd_sandbox_image: Pause image containerd starts for each pod
#                        sandbox. Must match the Kubernetes minor version —
#                        'kubeadm config images list' on a node prints the
#                        expected value (default: registry.k8s.io/pause:3.10.1).
#   containerd_certs_dir: Directory containerd searches for per-registry
#                        hosts.toml mirror configuration. Named in the
#                        containerd config written here; the files under it are
#                        written by cluster/registry.yml, which must use the
#                        same value (default: /etc/containerd/certs.d).
#   helm_keyring_path:   Path to store the Helm APT GPG keyring
#                        (default: /etc/apt/keyrings/helm.gpg).
#   helm_packages:       List of Helm packages to install (default: [helm]).
#   k9s_version:         Version of k9s to install (default: 0.50.18).
#   kubectl_config_path: Full path to the kubectl config file used by the drain
#                        script (default: /home/<ansible_user>/.kube/config).
#   k8s_drain_script_path: Path where the node lifecycle script is installed on each node
#                        (default: /usr/local/bin/k8s-node-lifecycle.sh).
#   k8s_drain_timeout:      Seconds to wait for drain to complete before giving up
#                           and proceeding with shutdown anyway (default: 900).
#   k8s_drain_grace_period: Seconds each pod gets to terminate gracefully during
#                           drain. Should be long enough for databases to flush
#                           writes cleanly (default: 120).
#                        The systemd TimeoutStopSec is set to this value + 30s.
#   k8s_uncordon_timeout: Seconds to retry uncordoning the node on startup before
#                        giving up (default: 900). Runs in the background and does
#                        not block boot.
#   k8s_iscsi_disconnect_timeout: Seconds to wait for iSCSI sessions to clear
#                        during suspend after docker has stopped and sessions
#                        have been logged out. Prevents the kernel from
#                        suspending with active iSCSI connections (default: 60).
#   k8s_suspend_script_path: Path where the suspend lifecycle script is
#                        installed on each node
#                        (default: /usr/local/bin/k8s-suspend.sh).

# serial: 1 runs the whole play through on one node before starting the next.
# This play can restart containerd and the kubelet, and Ansible otherwise
# advances task-by-task across all hosts — so a configuration that stops
# containerd from starting would be written to every node before the first
# restart revealed it. Running a node at a time means a failure stops the run
# with the remaining nodes untouched, which on a two-node cluster is the
# difference between a degraded cluster and no cluster.
#
# The cost is that every run is serialized, including ones that change nothing.
# The alternative is remembering to pass --limit at the call site, which is not
# a property of the playbook and so is not a property anyone can rely on.
- name: Install and configure Kubernetes
  hosts: nodes
  serial: 1
  become: true
  become_exe: sudo.ws
  vars:
    kube_version: v1.35
    keyring_path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    kube_packages:
      - kubelet
      - kubeadm
      - kubectl
      - cri-tools
    containerd_config_path: /etc/containerd/config.toml
    crictl_config_path: /etc/crictl.yaml
    containerd_cri_endpoint: unix:///run/containerd/containerd.sock
    containerd_sandbox_image: registry.k8s.io/pause:3.10.1
    containerd_certs_dir: /etc/containerd/certs.d
    helm_keyring_path: /etc/apt/keyrings/helm.gpg
    helm_packages:
      - helm
    k9s_version: 0.50.18
    kubectl_config_path: "/home/{{ ansible_user }}/.kube/config"
    k8s_drain_script_path: /usr/local/bin/k8s-node-lifecycle.sh
    k8s_suspend_script_path: /usr/local/bin/k8s-suspend.sh
    k8s_drain_timeout: 900
    k8s_drain_grace_period: 120
    k8s_uncordon_timeout: 900
    k8s_iscsi_disconnect_timeout: 60

  tasks:
    # -------------------------------------------------------------------------
    # Prerequisites
    # Installs essential packages required to establish secure communication
    # and key validation:
    #   - ca-certificates:     Ensures secure HTTPS connections to external repos.
    #   - curl:                Used to download GPG keys and external resources.
    #   - gnupg:               Necessary to manage and dearmor GPG keys for
    #                          package validation.
    #   - apt-transport-https: Allows APT to securely fetch packages over HTTPS.
    # This section also prepares the standard system keyring directory.
    # -------------------------------------------------------------------------
    - name: Install prerequisite packages for Kubernetes repository
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - apt-transport-https
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure /etc/apt/keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    # -------------------------------------------------------------------------
    # Repository Configuration
    # Sets up the official Kubernetes APT repository to enable package management.
    # It ensures authenticity by downloading and dearmoring the official
    # Kubernetes GPG key (converting it from ASCII to a binary format readable
    # by APT). The key is placed in the modern /etc/apt/keyrings path.
    # Finally, the repository source list is added, allowing standard APT
    # commands to find and install kubelet, kubeadm, and kubectl.
    # -------------------------------------------------------------------------
    - name: Stat Kubernetes GPG key
      ansible.builtin.stat:
        path: '{{ keyring_path }}'
      register: k8s_keyring_stat

    - name: Download and dearmor Kubernetes GPG key
      when: not k8s_keyring_stat.stat.exists
      block:
        - name: Download Kubernetes GPG key
          ansible.builtin.get_url:
            url: https://pkgs.k8s.io/core:/stable:/{{ kube_version }}/deb/Release.key
            dest: /tmp/k8s-release.key
            mode: '0644'

        - name: Dearmor Kubernetes GPG key
          ansible.builtin.command:
            cmd: gpg --dearmor -o {{ keyring_path }} /tmp/k8s-release.key
          args:
            creates: '{{ keyring_path }}'

        - name: Clean up temporary Kubernetes GPG key file
          ansible.builtin.file:
            path: /tmp/k8s-release.key
            state: absent

    # The file does not exist before the first run, and lineinfile with
    # state absent fails on a missing path rather than treating it as nothing
    # to remove.
    - name: Stat the Kubernetes APT sources file
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/kubernetes.list
      register: k8s_sources_stat

    # apt_repository adds an entry and never removes one, so raising
    # kube_version leaves the old channel in the file next to the new one and
    # apt resolves packages across both. The nodes carried the v1.28 and v1.35
    # channels together until 2026-08-18; the apt-mark holds below are what
    # kept that from selecting a package from the wrong one.
    #
    # Runs before the channel is added so the apt_repository task refreshes the
    # cache against an already-clean file, rather than needing a second update.
    #
    # The negative lookahead keeps the current channel while removing every
    # other: lineinfile's regexp is a Python regular expression, and state
    # absent removes every line it matches.
    - name: Remove superseded Kubernetes APT repository channels
      ansible.builtin.lineinfile:
        path: /etc/apt/sources.list.d/kubernetes.list
        regexp: >-
          ^deb .*pkgs\.k8s\.io/core:/stable:/(?!{{ kube_version | regex_escape }}/)v[0-9.]+/
        state: absent
      when: k8s_sources_stat.stat.exists

    - name: Add Kubernetes APT repository
      ansible.builtin.apt_repository:
        repo: >
          deb [signed-by={{ keyring_path }}]
          https://pkgs.k8s.io/core:/stable:/{{ kube_version }}/deb/ /
        state: present
        filename: kubernetes
        update_cache: true

    # -------------------------------------------------------------------------
    # System Configuration
    # Configures essential kernel modules, networking parameters, and swap
    # settings required by Kubernetes and its container runtime (CRI). These
    # are applied before any Kubernetes components are installed or started:
    #   - chrony:        Ensures time synchronization is active across all nodes.
    #                    Clock skew between nodes can cause certificate validation
    #                    failures and leader election issues in the cluster.
    #   - overlay:       Required by the container runtime for the overlay
    #                    filesystem (managing container image layers).
    #   - br_netfilter:  Enables transparent masquerading and facilitates VxLAN
    #                    traffic for cross-node pod communication.
    #   - sysctl params: Enables dual-stack (IPv4/IPv6) IP forwarding (allowing
    #                    nodes to route pod traffic) and ensures bridged network
    #                    traffic is processed by iptables/ip6tables for filtering.
    #                    Also increases fs.inotify.max_user_instances from the
    #                    default of 128 to 512. The default is easily exhausted
    #                    when many pods run on a single node, as each container
    #                    runtime and .NET application (e.g. Jellyfin) consumes
    #                    inotify instances for config file watching.
    #   - swap:          Disabled at runtime and permanently in /etc/fstab, as
    #                    kubelet requires swap to be off for accurate memory
    #                    limit enforcement.
    # -------------------------------------------------------------------------
    - name: Install chrony time synchronization daemon
      ansible.builtin.apt:
        name: chrony
        state: present

    - name: Start and enable chronyd service
      ansible.builtin.systemd:
        name: chronyd
        state: started
        enabled: true

    - name: Force immediate time synchronization via chrony
      ansible.builtin.command:
        cmd: chronyc makestep
      changed_when: false

    - name: Persist required kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: '0644'

    - name: Ensure overlay module is loaded
      ansible.builtin.command:
        cmd: modprobe overlay
      changed_when: false

    - name: Ensure br_netfilter module is loaded
      ansible.builtin.command:
        cmd: modprobe br_netfilter
      changed_when: false

    - name: Set sysctl parameters for Kubernetes networking
      ansible.posix.sysctl:
        name: '{{ item.key }}'
        value: '{{ item.value }}'
        sysctl_file: /etc/sysctl.d/k8s.conf
        sysctl_set: true
        state: present
        reload: true
      loop:
        - {key: 'net.bridge.bridge-nf-call-iptables', value: '1'}
        - {key: 'net.bridge.bridge-nf-call-ip6tables', value: '1'}
        - {key: 'net.ipv4.ip_forward', value: '1'}
        - {key: 'net.ipv6.conf.all.forwarding', value: '1'}
        - {key: 'fs.inotify.max_user_instances', value: '512'}

    - name: Disable swap at runtime
      ansible.builtin.command:
        cmd: swapoff -a
      changed_when: false

    - name: Permanently disable swap in /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    # -------------------------------------------------------------------------
    # Architecture Detection
    # Read once for the deb downloads further down (k9s).
    # -------------------------------------------------------------------------
    - name: Get CPU architecture for package downloads
      ansible.builtin.command: dpkg --print-architecture
      register: dpkg_arch
      changed_when: false

    # -------------------------------------------------------------------------
    # containerd CRI Runtime
    # Points the kubelet at containerd directly. containerd is installed by
    # infrastructure/docker.yml as the containerd.io package, so nothing is
    # installed here — the daemon is already running, with its CRI plugin
    # switched off.
    #
    # That is the one thing this section changes. Docker ships
    # /etc/containerd/config.toml containing disabled_plugins = ['cri'],
    # because Docker does not use CRI and leaving the plugin loaded would
    # expose a second runtime interface it does not manage. Kubernetes needs
    # that interface, so the file is replaced with one that does not disable
    # it.
    #
    # The file is written whole rather than edited in place. Replacing it means
    # Docker's shipped defaults for root, state, and the snapshotter are no
    # longer in the file, but containerd applies its own defaults for anything
    # absent and those are the same values — 'containerd config dump' shows the
    # effective result. Editing in place would leave the playbook's output
    # depending on what the installed Docker version happened to ship.
    #
    # Docker keeps working across this change. It talks to containerd over the
    # native API in the 'moby' namespace, which is unrelated to whether the CRI
    # plugin is loaded.
    # -------------------------------------------------------------------------
    - name: Configure containerd with the CRI plugin enabled
      ansible.builtin.template:
        src: containerd-config.toml.j2
        dest: '{{ containerd_config_path }}'
        mode: '0644'
        owner: root
        group: root
      notify: Restart containerd

    - name: Restart containerd before the kubelet is pointed at it
      ansible.builtin.meta: flush_handlers

    # crictl is the CRI client — the tool that inspects what the kubelet is
    # actually running, now that 'docker ps' shows only Docker's own
    # containers. It comes from the cri-tools package in kube_packages.
    #
    # Without this file crictl discovers the endpoint by trying a built-in
    # list of socket paths, printing a deprecation warning each time it falls
    # back. The suspend hook parses crictl output, so a warning on stderr and
    # a probe delay on every call are both worth removing.
    - name: Configure the crictl endpoint
      ansible.builtin.copy:
        dest: '{{ crictl_config_path }}'
        mode: '0644'
        owner: root
        group: root
        content: |
          runtime-endpoint: {{ containerd_cri_endpoint }}
          image-endpoint: {{ containerd_cri_endpoint }}
          timeout: 10

    # -------------------------------------------------------------------------
    # cri-dockerd Removal
    # The kubelet reached containerd through cri-dockerd until this playbook
    # started configuring the CRI plugin directly. Removing the package stops
    # and disables its units as part of the uninstall.
    #
    # The drop-in files are deleted separately: dpkg leaves files in
    # /etc/systemd/system alone because they are administrator-owned rather
    # than package-owned. A leftover after-cri-docker.conf orders the kubelet
    # after a unit that no longer exists, and systemd holds the kubelet in
    # 'activating' waiting for a job that can never run.
    # -------------------------------------------------------------------------
    - name: Remove the cri-dockerd package
      ansible.builtin.apt:
        name: cri-dockerd
        state: absent
        purge: true

    - name: Remove cri-dockerd and kubelet systemd drop-ins for cri-docker
      ansible.builtin.file:
        path: '{{ item }}'
        state: absent
      loop:
        - /etc/systemd/system/cri-docker.service.d/require-docker.conf
        - /etc/systemd/system/cri-docker.service.d
        - /etc/systemd/system/kubelet.service.d/after-cri-docker.conf
      notify: Reload systemd daemon

    # Containers cri-dockerd started keep running after it is removed. Each is
    # held by its own containerd-shim-runc-v2, which is not a child of anything
    # being stopped here, so removing the package orphans them rather than
    # ending them. They are in the 'moby' namespace, where the kubelet cannot
    # see them once it reads 'k8s.io' — so it starts replacements that collide
    # with processes still holding the same host ports and sockets.
    #
    # Observed on a worker node on 2026-08-18: cilium-envoy failed to bind
    # its domain socket (errno 98) and node-exporter failed on 0.0.0.0:9100,
    # both against their own predecessors. Two cilium-agents programming one
    # eBPF datapath also broke the node's DNS, which stalled every image pull.
    # A drain does not prevent this — DaemonSet pods are exempt from it by
    # design, and on a control-plane node the static pods are too, which is
    # where it would mean two etcds and two API servers.
    #
    # Placed before the kubelet is restarted so the old containers are gone
    # before their replacements are created, rather than after they have
    # already collided. The label is cri-dockerd's own, so this matches
    # nothing on a node that never ran it, and nothing a user started with
    # docker directly.
    #
    # failed_when: false covers a node where docker is absent or its daemon is
    # stopped, where there is nothing to find. It also means a stopped daemon
    # holding live containers — live-restore keeps them running — is read as
    # 'no orphans' and they are left to collide. Recovering from that is the
    # 'docker stop' by hand this task replaces, so the failure is visible in
    # the pods rather than here.
    - name: Find containers left behind by cri-dockerd
      ansible.builtin.command:
        cmd: docker ps --quiet --filter label=io.kubernetes.pod.namespace
      register: orphaned_cri_docker_containers
      changed_when: false
      failed_when: false

    - name: Stop containers left behind by cri-dockerd # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: docker stop {{ orphaned_cri_docker_containers.stdout_lines | join(' ') }}
      changed_when: true
      when: orphaned_cri_docker_containers.stdout_lines | length > 0

    # -------------------------------------------------------------------------
    # Kubernetes Installation and Configuration
    # Handles the core installation and system readiness for Kubernetes:
    #   - Installs the primary Kubernetes components (kubelet, kubeadm, kubectl).
    #   - Applies an 'apt-mark hold' to these packages to prevent unintentional
    #     version upgrades during routine system updates.
    #   - Configures kubelet extra args: cgroup driver (systemd, which must
    #     match SystemdCgroup in the containerd config above — a mismatch is
    #     accepted at start and surfaces later as pods failing to run), the CRI
    #     endpoint, and seccomp default (RuntimeDefault applied to every
    #     container that does not declare an explicit seccompProfile).
    #   - Starts and enables the kubelet service.
    #
    # The CRI endpoint is stated rather than left to the kubelet's built-in
    # default, which has changed between releases and is resolved by probing a
    # list of known socket paths when unset.
    # -------------------------------------------------------------------------
    - name: Install Kubernetes components
      ansible.builtin.apt:
        name: '{{ kube_packages }}'
        state: present

    - name: Hold Kubernetes packages from accidental upgrades
      ansible.builtin.dpkg_selections:
        name: '{{ item }}'
        selection: hold
      loop: '{{ kube_packages }}'

    - name: Configure kubelet extra args (cgroup driver, CRI endpoint, seccomp default)
      ansible.builtin.copy:
        dest: /etc/default/kubelet
        content: >-
          KUBELET_EXTRA_ARGS=--cgroup-driver=systemd
          --container-runtime-endpoint={{ containerd_cri_endpoint }}
          --seccomp-default=true
        mode: '0644'
      notify: restart kubelet

    - name: Write systemd drop-in to order kubelet after containerd
      ansible.builtin.copy:
        dest: /etc/systemd/system/kubelet.service.d/after-containerd.conf
        mode: '0644'
        owner: root
        group: root
        content: |
          [Unit]
          After=containerd.service
          Wants=containerd.service

    - name: Reload systemd daemon after kubelet drop-in changes
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Start and enable kubelet service
      ansible.builtin.systemd:
        name: kubelet
        state: started
        enabled: true

    # Handlers normally run at the end of the play, which is too late to be
    # safe here. Everything below this point — Helm, k9s, the lifecycle hooks —
    # downloads from the internet, and a failure in any of it aborts the play
    # before the kubelet is restarted. The node is left mid-migration at that
    # point: cri-dockerd purged, its socket gone, and the kubelet still the old
    # process pointing at it, which reports the node NotReady with a runtime of
    # 'docker://Unknown'.
    #
    # This is not hypothetical. It happened on a worker node on 2026-08-18,
    # when the k9s download failed DNS resolution and left the node stranded
    # until the kubelet was restarted by hand.
    - name: Restart the kubelet before any task that can fail on the network
      ansible.builtin.meta: flush_handlers

    # Asks the CRI endpoint itself rather than asking systemd whether
    # containerd is running. The two answer different questions: containerd
    # starts and reports active even when the CRI plugin failed to load, since
    # a plugin failure is recorded against the plugin and not the daemon. The
    # node then looks healthy from the outside while nothing serves the
    # kubelet, and the first symptom is pods never being created.
    #
    # Placed after the kubelet restart because crictl arrives with cri-tools in
    # kube_packages, which is installed in this section. Failing here stops the
    # play, which is correct — every task below assumes a working runtime, and
    # serial: 1 means the remaining nodes are left untouched.
    - name: Verify containerd is serving the CRI API
      ansible.builtin.command:
        cmd: crictl --runtime-endpoint {{ containerd_cri_endpoint }} version
      register: crictl_version
      changed_when: false
      until: crictl_version is succeeded
      retries: 6
      delay: 5

    # -------------------------------------------------------------------------
    # Helm Installation
    # Installs Helm, the package manager for Kubernetes.
    # Similar to the Kubernetes repository setup, this task downloads and
    # dearmors the official Helm GPG key, adds the dedicated Buildkite APT
    # repository, and cleanly installs the helm package to enable efficient
    # deployment of charts and applications to the cluster.
    # -------------------------------------------------------------------------
    - name: Stat Helm GPG key
      ansible.builtin.stat:
        path: '{{ helm_keyring_path }}'
      register: helm_keyring_stat

    - name: Download and dearmor Helm GPG key
      when: not helm_keyring_stat.stat.exists
      block:
        # Retried for the same reason as the k9s download below — see there.
        - name: Download Helm GPG key
          ansible.builtin.get_url:
            url: https://packages.buildkite.com/helm-linux/helm-debian/gpgkey
            dest: /tmp/helm-gpgkey
            mode: '0644'
          register: helm_gpg_download
          until: helm_gpg_download is succeeded
          retries: 5
          delay: 15

        - name: Dearmor Helm GPG key
          ansible.builtin.command:
            cmd: gpg --dearmor -o {{ helm_keyring_path }} /tmp/helm-gpgkey
          args:
            creates: '{{ helm_keyring_path }}'

        - name: Clean up temporary Helm GPG key file
          ansible.builtin.file:
            path: /tmp/helm-gpgkey
            state: absent

    - name: Add Helm APT repository
      ansible.builtin.apt_repository:
        repo: >
          deb [signed-by={{ helm_keyring_path }}]
          https://packages.buildkite.com/helm-linux/helm-debian/any/ any main
        state: present
        filename: helm-stable-debian
        update_cache: true

    - name: Install Helm components
      ansible.builtin.apt:
        name: '{{ helm_packages }}'
        state: present

    - name: Hold Helm packages from accidental upgrades
      ansible.builtin.dpkg_selections:
        name: '{{ item }}'
        selection: hold
      loop: '{{ helm_packages }}'

    # -------------------------------------------------------------------------
    # k9s Installation
    # Installs k9s, a terminal-based UI for interacting with Kubernetes clusters.
    # k9s provides real-time visibility into cluster resources and simplifies
    # navigation, inspection, and management of workloads directly from the
    # terminal. The release deb package is fetched from GitHub and installed
    # via APT, then the temporary file is removed.
    #
    # Retried because this task runs shortly after the kubelet and containerd
    # restarts above, and Cilium re-establishing the host datapath takes the
    # node's own DNS resolution with it for a few tens of seconds. The download
    # fails with 'Temporary failure in name resolution' — which is EAI_AGAIN
    # from the resolver, not the registry or GitHub being unreachable.
    #
    # It failed here on both nodes during the cri-dockerd to containerd
    # migration on 2026-08-18, and because a failing task ends the play for
    # that host, it took the lifecycle script installs below with it. Five
    # attempts 15 seconds apart covers the window.
    # -------------------------------------------------------------------------
    - name: Download k9s deb package
      ansible.builtin.get_url:
        url: https://github.com/derailed/k9s/releases/download/v{{ k9s_version }}/k9s_linux_{{ dpkg_arch.stdout }}.deb # noqa: yaml[line-length]
        dest: /tmp/k9s.deb
        mode: '0644'
      register: k9s_download
      until: k9s_download is succeeded
      retries: 5
      delay: 15

    - name: Install k9s package
      ansible.builtin.apt:
        deb: /tmp/k9s.deb
        state: present

    - name: Clean up temporary k9s deb file
      ansible.builtin.file:
        path: /tmp/k9s.deb
        state: absent

    # -------------------------------------------------------------------------
    # Graceful Shutdown Hook
    # Installs a systemd service that manages the node lifecycle around shutdowns
    # and startups. On shutdown (ExecStop), the node is cordoned and drained before
    # the system goes down, allowing Longhorn volumes to detach cleanly. On startup
    # (ExecStart), the node is uncordoned so pod scheduling resumes.
    #
    # If the API server is unreachable or the drain times out, the script logs
    # the failure and exits 0 so the shutdown is never blocked. TimeoutStopSec
    # is set to k8s_drain_timeout + 30 seconds to give the drain time to
    # complete before systemd kills the service.
    #
    # To bypass the hook for an immediate shutdown (e.g. in an emergency):
    #   systemctl mask k8s-graceful-shutdown.service && shutdown -h now
    # After the node comes back up, restore the hook with:
    #   systemctl unmask k8s-graceful-shutdown.service
    # -------------------------------------------------------------------------
    - name: Install Kubernetes node lifecycle script
      ansible.builtin.template:
        src: k8s-node-lifecycle.sh.j2
        dest: '{{ k8s_drain_script_path }}'
        mode: '0755'
        owner: root
        group: root

    - name: Install Kubernetes graceful shutdown service
      ansible.builtin.template:
        src: k8s-graceful-shutdown.service.j2
        dest: /etc/systemd/system/k8s-graceful-shutdown.service
        mode: '0644'
        owner: root
        group: root

    - name: Reload systemd daemon to register graceful shutdown service
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable Kubernetes graceful shutdown service
      ansible.builtin.systemd:
        name: k8s-graceful-shutdown.service
        enabled: true

    # -------------------------------------------------------------------------
    # Suspend Lifecycle Service
    # Systemd service that manages local node state around system suspend.
    # Using a service with Before=sleep.target gives systemd explicit dependency
    # tracking — it waits for the service to complete before allowing sleep and
    # runs ExecStop on resume. This works for both S3 and S0ix (modern standby),
    # unlike sleep hooks in /lib/systemd/system-sleep/ which are unreliable
    # under S0ix.
    #
    # The hook script runs purely local operations — no kubectl, no drain, no
    # cross-node coordination. It treats suspend as an unclean event (like a
    # brief power loss) and relies on Longhorn's native reconciliation to
    # recover on wake.
    #
    # On pre-suspend (ExecStart): stops kubelet, gracefully stops all
    # containers, stops docker and containerd, force-unmounts any lingering
    # Longhorn mounts, logs out iSCSI sessions, waits for /dev/sd* to detach,
    # stops iscsid, and syncs.
    #
    # On post-resume (ExecStop): starts iscsid, containerd, docker, and
    # kubelet. Longhorn and workload pods reconcile on their own.
    # -------------------------------------------------------------------------
    - name: Remove GRUB S3 sleep mode configuration if present
      ansible.builtin.file:
        path: /etc/default/grub.d/mem-sleep.cfg
        state: absent
      notify: Update GRUB

    - name: Remove legacy suspend sleep hook if present
      ansible.builtin.file:
        path: /lib/systemd/system-sleep/k8s-suspend
        state: absent

    - name: Install Kubernetes suspend lifecycle script
      ansible.builtin.template:
        src: k8s-suspend-hook.sh.j2
        dest: '{{ k8s_suspend_script_path }}'
        mode: '0755'
        owner: root
        group: root

    - name: Install Kubernetes suspend lifecycle service
      ansible.builtin.template:
        src: k8s-suspend.service.j2
        dest: /etc/systemd/system/k8s-suspend.service
        mode: '0644'
        owner: root
        group: root
      notify: Reload systemd daemon

    - name: Enable Kubernetes suspend lifecycle service
      ansible.builtin.systemd:
        name: k8s-suspend.service
        enabled: true
        daemon_reload: true

    # -------------------------------------------------------------------------
    # kubeadm CRI Socket Annotation
    # kubeadm records each node's CRI endpoint in the
    # kubeadm.alpha.kubernetes.io/cri-socket annotation, and reads it back on
    # 'kubeadm upgrade' to find the runtime. bootstrap.yml sets it, but only at
    # 'kubeadm init' and 'kubeadm join' time — nothing keeps it in step with
    # containerd_cri_endpoint afterward. Changing the runtime therefore leaves
    # every existing node annotated with a socket that no longer exists, and
    # the failure surfaces at the next upgrade rather than at the change.
    #
    # Both nodes were corrected by hand during the cri-dockerd to containerd
    # migration on 2026-08-18. This task is what makes that unnecessary.
    #
    # Last in the play, and read-before-write rather than 'annotate
    # --overwrite' on every run, for two different reasons. Last because it
    # needs the API server, which on a control-plane node is a static pod that
    # has just been restarted by the runtime change above — the retries cover
    # that, and being last means exhausting them cannot prevent anything else
    # from being applied. Read-before-write because 'kubectl annotate' prints
    # 'annotated' whether or not the value moved, so writing unconditionally
    # would report a change on every run forever.
    # -------------------------------------------------------------------------
    - name: Read the kubeadm CRI socket annotation from every node
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig={{ kubectl_config_path }} get node {{ item }}
          -o jsonpath={.metadata.annotations.kubeadm\.alpha\.kubernetes\.io/cri-socket}
      register: cri_socket_current
      changed_when: false
      until: cri_socket_current is succeeded
      retries: 10
      delay: 15
      loop: '{{ groups["nodes"] }}'
      when: bootstrap_node | default(false)

    - name: Correct the kubeadm CRI socket annotation where it is stale
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig={{ kubectl_config_path }}
          annotate node {{ item.item }}
          kubeadm.alpha.kubernetes.io/cri-socket={{ containerd_cri_endpoint }}
          --overwrite
      changed_when: true
      loop: '{{ cri_socket_current.results | default([]) }}'
      loop_control:
        label: '{{ item.item }}'
      when:
        - bootstrap_node | default(false)
        - item.stdout | default('') != containerd_cri_endpoint

  handlers:
    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    # One node at a time, which serial: 1 on the play already guarantees — no
    # throttle here, so there is one mechanism enforcing that rather than two
    # that could disagree. Loading the CRI plugin means restarting containerd,
    # which drops the CRI connection the kubelet holds; the kubelet reconnects
    # on its own, but the node reports NotReady until it does.
    #
    # Running containers survive this. Each is held by its own
    # containerd-shim-runc-v2 process, which is deliberately not a child of
    # containerd and keeps running while the daemon is down; the shims
    # re-attach when it comes back. Docker's containers are equally unaffected,
    # and for the same reason rather than because of live-restore.
    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted

    - name: Update GRUB
      ansible.builtin.command:
        cmd: update-grub
      changed_when: true

    # Restarts kubelet on a single node at a time (throttle: 1) and waits
    # for the kubelet secure port (10250) to accept connections before
    # moving on to the next node. Running pods are not terminated by a
    # kubelet restart, and the kernel-level seccomp filter on any
    # already-created container does not change — the new default only
    # applies to containers created after kubelet returns. Pod Security
    # Admission restricted namespaces are unaffected because their pods
    # already declare RuntimeDefault explicitly.
    #
    # Both handlers listen on the 'restart kubelet' topic so that the
    # wait_for verification always runs in the same throttled pass as the
    # restart itself, keeping the rolling-restart invariant intact.
    - name: Restart kubelet
      ansible.builtin.systemd:
        name: kubelet
        state: restarted
        daemon_reload: true
      throttle: 1
      listen: restart kubelet

    - name: Wait for kubelet port to accept connections after restart
      ansible.builtin.wait_for:
        port: 10250
        host: '{{ ansible_default_ipv4.address }}'
        delay: 5
        timeout: 120
      throttle: 1
      listen: restart kubelet
